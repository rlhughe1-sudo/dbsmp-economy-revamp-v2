
name: DBSMPEconomy
version: '1.0.0'
main: com.ryden.dbsmp.DBSMPEconomy
author: Ryden
description: "DBSMP economy, shop, selling, trading, and friend requests for Paper 1.8.8"

commands:
  bal:
    description: "Check your balance"
    usage: "/bal"
  pay:
    description: "Send money to another player"
    usage: "/pay <player> <amount>"
  shop:
    description: "Open the item shop"
    usage: "/shop"
  sell:
    description: "Sell items for money"
    usage: "/sell <item> <amount>"
  trade:
    description: "Trade items with another player"
    usage: "/trade <player>"
  friend:
    description: "Send a friend request"
    usage: "/friend <player>"
  friends:
    description: "View your friends"
    usage: "/friends"
  eco:
    description: "Economy admin command"
    usage: "/eco"
